# daily-pulse configuration. Secrets (GITHUB_TOKEN, IG_CLI_CMD) come from the environment only.

[run]
first_run_cap = 10          # newest items processed on a source's first run
alert_after_failures = 2    # consecutive module failures before a run flags it

[paths]
data_dir = "../data"        # local-only state, logs, transcripts (gitignored); relative to this file

[site]
base_url = "https://themikemoniker.github.io/daily-pulse/"  # digest links are built from this

[summarizer]
claude_cmd = "claude"       # the CLI used for `claude -p`; $DAILY_PULSE_CLAUDE overrides it
max_calls = 30              # cap on `claude -p` calls per run, retries included

[quality]
min_rating = 5              # the ranked list shows only items rated at least this (and not "skip")
min_duration_seconds = 240  # YouTube: skips Shorts and clips
max_duration_seconds = 7200 # YouTube: skips very long streams
channel_allowlist = []      # always kept: they bypass every check and the triage call
channel_blocklist = []      # channel names (case-insensitive) dropped before any claude call
title_blocklist = []        # case-insensitive substrings of a title that drop the item
max_triage_calls = 10       # cap on triage `claude -p` calls per run (one call covers up to 40 items)

[sources.youtube]
enabled = true
playlist_url = "https://www.youtube.com/playlist?list=PLOsrHd23kLUo"  # the "brain" playlist
playlist_order = "oldest_first"  # this playlist appends new videos at the bottom; "newest_first" otherwise.
                                 # Leave it out to detect the order from the first and last upload dates.
ytdlp_cmd = "yt-dlp"        # path to yt-dlp; scripts/install-ytdlp.sh puts it at <repo>/.venv/bin/yt-dlp
pace_seconds = 3            # pause between yt-dlp calls; YouTube answers HTTP 429 to a burst of caption requests
rate_limit_backoff_seconds = [30, 90]  # after a 429, wait this long and retry; the source stops if it persists
ytdlp_extra_args = []       # added to every yt-dlp call, e.g. ["--js-runtimes", "node"] when deno is not installed

[sources.instagram]
enabled = true
kinds = ["saved", "liked"]  # saved reels first, liked second
cli_cmd_env = "IG_CLI_CMD"  # env var holding the command that prints JSON

[sources.x]
enabled = true              # module is deferred in v1; handles are stored for later
handles = [
  "Andrej Karpathy",
  "Matt Pocock",
  "Nate Herk",
  "Simon Willison",
  "Hamel Husain",
  "Harrison Chase",
  "swyx",
  "TheSeniorDev",           # unverified
  "Exit Node",              # unverified
]

[sources.github]
enabled = true
rising_days = 7
watch_accounts = [
  "karpathy", "mattpocock", "can1357", "simonw", "hamelsmu", "shreyashankar",
  "jxnl", "eugeneyan", "hwchase17", "anthropics", "langchain-ai",
]
watch_repos = ["can1357/oh-my-pi"]  # releases, plus top contributors
push_min_stars = 25         # a push with no release or tag counts only for a repo with at least this many stars
ignore_repos = [            # owner/name globs (case-insensitive): no items at all from these repos
  "simonw/simonw", "simonw/scrape-*", "simonw/*-scraper", "simonw/*-atom-feed",  # push every day, no signal
]
